<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1024px;
    height: 768px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000;
  }

  #windy {
    position: absolute;
    top: 0; left: 0;
    width: 1024px;
    height: 768px;
    border: none;
    z-index: 0;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 1024px;
    height: 768px;
    z-index: 10;
    pointer-events: none;
  }

  .widget {
    position: absolute;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    color: #fff;
    padding: 12px 16px;
    pointer-events: auto;
  }

  /* Clock - top right */
  #clock-widget {
    top: 16px;
    right: 16px;
    text-align: right;
    min-width: 200px;
  }

  #time {
    font-size: 52px;
    font-weight: 200;
    letter-spacing: -1px;
    line-height: 1;
  }

  #date {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    margin-top: 4px;
  }

  /* Weather - top left */
  #weather-widget {
    top: 16px;
    left: 16px;
    min-width: 220px;
  }

  #weather-location {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  #weather-main {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #weather-temp {
    font-size: 48px;
    font-weight: 200;
    line-height: 1;
  }

  #weather-icon {
    font-size: 36px;
  }

  #weather-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    margin-top: 6px;
  }

  #weather-details {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
    display: flex;
    gap: 12px;
  }



  /* Status - bottom left */
  #status-widget {
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    padding: 6px 10px;
  }

  #last-updated {
    font-size: 11px;
  }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    margin-right: 5px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<iframe id="windy"
  src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=in&metricTemp=°F&metricWind=mph&zoom=5&overlay=wind&product=ecmwf&level=surface&lat=29.535&lon=-94.658&detailLat=32.914&detailLon=-97.173&detail=true&pressure=true&message=true"
  frameborder="0">
</iframe>

<div id="overlay">

  <div class="widget" id="weather-widget">
    <div id="weather-location">Colleyville, TX</div>
    <div id="weather-main">
      <div id="weather-temp">--°</div>
      <div id="weather-icon">--</div>
    </div>
    <div id="weather-desc">Loading...</div>
    <div id="weather-details">
      <span id="weather-humidity">--</span>
      <span id="weather-wind">--</span>
    </div>
  </div>

  <div class="widget" id="clock-widget">
    <div id="time">--:--</div>
    <div id="date">--</div>
  </div>



  <div class="widget" id="status-widget">
    <span class="dot"></span>
    <span id="last-updated">Live</span>
  </div>

</div>

<script>
  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes().toString().padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = (h % 12) || 12;
    document.getElementById('time').textContent = h12 + ':' + m + ' ' + ampm;

    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('date').textContent =
      days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ' ' + now.getFullYear();
  }

  updateClock();
  setInterval(updateClock, 1000);

  function weatherIcon(code) {
    if (code <= 232) return '⛈';
    if (code <= 321) return '🌦';
    if (code <= 531) return '🌧';
    if (code <= 622) return '❄️';
    if (code <= 781) return '🌪';
    if (code === 800) return '☀️';
    if (code <= 802) return '⛅';
    return '☁️';
  }

  async function fetchWeather() {
    try {
      const res = await fetch(
        'https://api.open-meteo.com/v1/forecast?latitude=32.8957&longitude=-97.0544&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago'
      );
      const d = await res.json();
      const c = d.current;
      const temp = Math.round(c.temperature_2m);
      const humidity = c.relative_humidity_2m;
      const wind = Math.round(c.wind_speed_10m);
      const code = c.weather_code;

      document.getElementById('weather-temp').textContent = temp + '°';
      document.getElementById('weather-icon').textContent = weatherIcon(code);
      document.getElementById('weather-humidity').textContent = 'Humidity ' + humidity + '%';
      document.getElementById('weather-wind').textContent = 'Wind ' + wind + ' mph';

      const descs = {
        0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
        45:'Foggy',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
        61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',
        80:'Rain showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',
        96:'Thunderstorm w/ hail',99:'Heavy thunderstorm'
      };
      document.getElementById('weather-desc').textContent = descs[code] || 'Conditions updating';
    } catch(e) {
      document.getElementById('weather-desc').textContent = 'Weather unavailable';
    }
  }

  fetchWeather();
  setInterval(fetchWeather, 10 * 60 * 1000);

  function goFullscreen() {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
  }

  window.addEventListener('load', function() {
    setTimeout(goFullscreen, 1500);
  });

  document.addEventListener('click', goFullscreen);

  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) location.reload();
  });

  setTimeout(function() {
    location.reload();
  }, 6 * 60 * 60 * 1000);

</script>
</body>
</html>
